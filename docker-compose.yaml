# Local development database. Each developer gets their own Postgres; nothing here touches a shared DB.
#
#   docker compose up -d && docker compose wait db-seed          start the DB, migrate it to this branch's head, seed user 4
#   SNAPSHOT=$HOME/Downloads/dump.dump docker compose run --rm db-restore && docker compose up -d
#                                                                replace the DB with that snapshot file, then migrate and seed
#   docker compose down -v                                       delete the DB (next `up` starts empty again)
#
# Run the API on the host with `cp example.env .env` and `python -m userapp.main`; it connects to localhost:5432.

# One project name for every checkout and worktree, so they all share one DB instead of competing for port 5432
name: chtc-userapp-dev

x-postgres-image: &postgres-image postgres:17.12

x-db-credentials: &db-credentials
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: chtc-userapp
  DB_USER: postgres
  DB_PASSWORD: postgres

services:
  db:
    image: *postgres-image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chtc-userapp
    ports:
      # Conflicts with anything else on 5432, such as a port-forward to a shared DB; `make test` uses 5433
      - "127.0.0.1:5432:5432"
    volumes:
      - userapp-db:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the default socket: on first start the image's temporary init server answers on the socket only
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "chtc-userapp"]
      interval: 2s
      retries: 30

  # Migrates the DB to the checked-out branch's head, then exits. Runs on every `docker compose up`.
  db-init:
    build: .
    # Rebuild on every `up` (cached unless requirements.txt changed) so migrations run with this branch's packages
    pull_policy: build
    volumes:
      # Mount the working tree so migrations match the current branch, not the image's copy
      - ./userapp:/app/userapp:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    environment:
      <<: *db-credentials
      PYTHON_ENV: development
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  # Adds admin user 4, the user the UI's dev login token points at, unless it already exists
  # (a restored snapshot has its own user 4, which is left alone). Runs after every migration, then exits.
  db-seed:
    image: *postgres-image
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: chtc-userapp
    # setval: an explicit id doesn't advance the SERIAL sequence; move it past MAX(id) so new users don't collide,
    # but never backwards (a snapshot's sequence can be past MAX(id) when users were deleted)
    command: >
      psql -v ON_ERROR_STOP=1 -c "INSERT INTO users (id, name, is_admin, active, unix_uid)
      VALUES (4, 'Local Dev Admin', true, true, 50000) ON CONFLICT (id) DO NOTHING;
      SELECT setval('users_id_seq', GREATEST((SELECT MAX(id) FROM users), (SELECT last_value FROM users_id_seq)));"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Replaces the local DB with a pg_dump custom-format snapshot (pg_dump -F c). Only runs when asked for.
  # SNAPSHOT is the file's absolute path, wherever it is kept; the file is mounted read-only and never copied.
  db-restore:
    image: *postgres-image
    profiles: ["restore"]
    volumes:
      # /dev/null when unset, so other compose commands work without SNAPSHOT; the command below rejects it.
      # create_host_path: false makes a mistyped path an error instead of a new empty directory.
      - type: bind
        source: ${SNAPSHOT:-/dev/null}
        target: /snapshot.dump
        read_only: true
        bind:
          create_host_path: false
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    # Checks the file is a dump before touching anything, then restores into a scratch DB and swaps it in,
    # so a bad file or a failed restore leaves the current DB as it was.
    # --no-owner/--no-acl: the source cluster's roles don't exist locally
    command:
      - sh
      - -c
      - |
        set -e
        if ! test -f /snapshot.dump || ! pg_restore -l /snapshot.dump >/dev/null; then
          echo "SNAPSHOT must be the absolute path of a pg_dump -F c file; the database was not changed"
          exit 1
        fi
        dropdb --if-exists chtc-userapp-restore
        createdb chtc-userapp-restore
        pg_restore --no-owner --no-acl --exit-on-error -d chtc-userapp-restore /snapshot.dump
        dropdb --force --if-exists chtc-userapp
        psql -v ON_ERROR_STOP=1 -d postgres -c 'ALTER DATABASE "chtc-userapp-restore" RENAME TO "chtc-userapp"'
    depends_on:
      db:
        condition: service_healthy

volumes:
  userapp-db:
